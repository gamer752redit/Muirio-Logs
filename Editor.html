<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUIRIO.DE | Shader & Box 1-Click Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --bg-main: #0b0f19;
      --bg-topbar: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --border: #334155;
      --text-main: #cbd5e1;
      --text-heading: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #8b5cf6;
      --accent-hover: #a78bfa;
      --accent-glow: rgba(139, 92, 246, 0.25);
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: var(--font-ui); background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      height: 64px; background: var(--bg-topbar); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 32px; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 1.1rem; color: var(--text-heading); }
    .brand-logo { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), #c084fc); border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; box-shadow: 0 0 15px var(--accent-glow); }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 24px; background: var(--bg-topbar); border-bottom: 1px solid var(--border); align-items: center;
    }
    .toolbar-group { display: flex; gap: 6px; align-items: center; border-right: 1px solid var(--border); padding-right: 12px; margin-right: 6px; flex-wrap: wrap; }
    .toolbar-group:last-child { border-right: none; padding-right: 0; margin-right: 0; }
    
    button { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: 0.15s; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    button:hover { background: var(--bg-card-hover); color: var(--text-heading); border-color: var(--accent); }
    
    .btn-green { border-color: rgba(16, 185, 129, 0.4); color: #34d399; background: rgba(16, 185, 129, 0.1); }
    .btn-green:hover { background: rgba(16, 185, 129, 0.2); }
    .btn-red { border-color: rgba(239, 68, 68, 0.4); color: #f87171; background: rgba(239, 68, 68, 0.1); }
    .btn-red:hover { background: rgba(239, 68, 68, 0.2); }
    .btn-primary { background: rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.4); color: #c084fc; }
    .btn-primary:hover { background: rgba(139, 92, 246, 0.35); border-color: var(--accent); }

    .main-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 24px; flex: 1; height: calc(100vh - 128px); overflow: hidden; }
    @media(max-width: 1000px) { .main-container { grid-template-columns: 1fr; height: auto; overflow-y: auto; } }

    .pane { display: flex; flex-direction: column; gap: 8px; height: 100%; }
    .pane-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 700; }
    
    textarea { width: 100%; height: 100%; background: #07090f; border: 1px solid var(--border); border-radius: 10px; padding: 18px; color: #f8fafc; font-family: var(--font-mono); font-size: 0.88rem; line-height: 1.6; resize: none; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

    .preview-pane { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; overflow-y: auto; height: 100%; }

    /* Component Box Styles */
    .box-green { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.3); border-left: 4px solid #10b981; padding: 20px; border-radius: 0 10px 10px 0; margin: 1.2em 0; }
    .box-green h2, .box-green h3 { color: #34d399; }
    .box-green strong { color: #6ee7b7; }

    .box-red { background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3); border-left: 4px solid #ef4444; padding: 20px; border-radius: 0 10px 10px 0; margin: 1.2em 0; }
    .box-red h2, .box-red h3 { color: #f87171; }
    .box-red strong { color: #fca5a5; }

    /* ══════════ ALLE SHADER & EFFEKTE (IDENTISCH ZU INDEX.HTML) ══════════ */
    .sh-rainbow { background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); background-size:200%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:sh-rainbow 3s linear infinite; font-weight:700; }
    @keyframes sh-rainbow { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
    .sh-glow { text-shadow:0 0 8px #a084f0,0 0 20px #7c5af5; animation:sh-glow 2s infinite alternate; }
    @keyframes sh-glow { from{text-shadow:0 0 8px #a084f0} to{text-shadow:0 0 20px #fff,0 0 35px #a084f0} }
    .sh-neon { text-shadow:0 0 5px #fff,0 0 15px #0ff,0 0 30px #0ff; animation:sh-neon 1.5s infinite alternate; }
    @keyframes sh-neon { 0%,19%,21%,23%,25%,54%,56%,100%{opacity:1} 20%,24%,55%{opacity:0.4} }
    .sh-fire { color:#ff6a00; text-shadow:0 0 8px #ff4500,0 0 20px #ff6347; animation:sh-fire 0.8s infinite alternate; }
    @keyframes sh-fire { from{text-shadow:0 0 8px #ff4500} to{text-shadow:0 0 15px #ffa500,0 0 35px #ff4500} }
    .sh-ice { color:#a0d8ef; text-shadow:0 0 8px #87ceeb; animation:sh-ice 2s ease-in-out infinite; }
    @keyframes sh-ice { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.4)} }
    .sh-shadow { text-shadow:3px 3px 0 rgba(0,0,0,0.4),6px 6px 0 rgba(139,92,246,0.2); }
    .sh-outline { -webkit-text-stroke:1px #7c5af5; color:transparent; }
    .sh-gradient-bg { background:linear-gradient(135deg,#8b5cf6,#ec4899); padding:2px 8px; border-radius:4px; color:#fff; font-weight:600; }
    .sh-warn { background:rgba(239,68,68,0.18); border:2px solid #ef4444; border-radius:6px; padding:4px 8px; color:#fca5a5; font-weight:600; box-shadow:0 0 15px rgba(239,68,68,0.3); animation:sh-warn 1.5s infinite; }
    @keyframes sh-warn { 0%,100%{box-shadow:0 0 15px rgba(239,68,68,0.3)} 50%{box-shadow:0 0 30px rgba(239,68,68,0.6)} }
    .sh-spin { display:inline-block; animation:sh-spin 2s linear infinite; }
    @keyframes sh-spin { to{transform:rotate(360deg)} }
    .sh-bounce { display:inline-block; animation:sh-bounce 0.6s ease-in-out infinite alternate; }
    @keyframes sh-bounce { from{transform:translateY(0)} to{transform:translateY(-8px)} }
    .sh-wave { display:inline-block; animation:sh-wave 1.5s ease-in-out infinite; }
    @keyframes sh-wave { 0%,100%{transform:translateY(0)} 25%{transform:translateY(-5px)} 75%{transform:translateY(3px)} }
    .sh-glitch { position:relative; animation:sh-glitch 0.3s infinite; display:inline-block; }
    @keyframes sh-glitch { 0%,100%{transform:translate(0)} 20%{transform:translate(-2px,2px)} 40%{transform:translate(2px,-2px)} 60%{transform:translate(-1px,-1px)} 80%{transform:translate(1px,1px)} }
    .sh-sparkle { background:linear-gradient(90deg,#ffd700,#fff8dc,#ffd700); background-size:200%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:sh-sparkle 2s linear infinite; }
    @keyframes sh-sparkle { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
    .sh-holo { background:linear-gradient(135deg,#ff0080,#ff8c00,#40e0d0,#ff0080); background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:sh-holo 4s ease infinite; }
    @keyframes sh-holo { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    .sh-matrix { color:#0f0; text-shadow:0 0 8px #0f0; font-family:monospace; }
    .sh-void { background:#fff; color:#000; padding:2px 6px; border-radius:3px; font-weight:700; }
    .sh-underline-glow { border-bottom:2px solid #7c5af5; box-shadow:0 2px 12px rgba(139,92,246,0.3); }
    .sh-strike-glow { text-decoration:line-through; text-decoration-color:#7c5af5; text-decoration-thickness:2px; text-shadow:0 0 8px #7c5af5; }
    .sh-double-line { border-top:2px solid #a084f0; border-bottom:2px solid #a084f0; padding:4px 0; display:inline-block; }
    .sh-zoom { display:inline-block; animation:sh-zoom 2s ease-in-out infinite; }
    @keyframes sh-zoom { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
    .sh-pulse { animation:sh-pulse 1s ease-in-out infinite; }
    @keyframes sh-pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    .sh-flicker { animation:sh-flicker 0.1s infinite alternate; }
    @keyframes sh-flicker { from{opacity:1} to{opacity:0.7} }
    .sh-reveal { position:relative; overflow:hidden; display:inline-block; }
    .sh-reveal::after { content:''; position:absolute; top:0; left:0; width:100%; height:100%; background:#7c5af5; animation:sh-reveal 2s forwards; }
    @keyframes sh-reveal { from{transform:translateX(-100%)} to{transform:translateX(100%)} }
    .sh-blur { filter:blur(2px); transition:filter 0.3s; }
    .sh-blur:hover { filter:blur(0); }
    .sh-metal { background:linear-gradient(180deg,#ddd,#999,#ddd); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:700; }
    .sh-emboss { text-shadow:1px 1px 0 rgba(255,255,255,0.2), -1px -1px 0 rgba(0,0,0,0.8); color:#aaa; }
    .sh-spotlight { background:radial-gradient(circle, #a084f0 0%, transparent 70%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .sh-shade { text-shadow:2px 2px 4px rgba(0,0,0,0.8), -1px -1px 2px rgba(255,255,255,0.1); }
    .sh-3d { text-shadow:1px 1px 0 #444, 2px 2px 0 #333, 3px 3px 0 #222; color:#fff; }
    .sh-vaporwave { color:#ff71ce; text-shadow:0 0 10px #01cdfe, 0 0 20px #05ffa1; font-style:italic; }
    .sh-cyberpunk { color:#f0e68c; text-shadow:0 0 8px #ff00ff, 0 0 18px #00ffff; letter-spacing:2px; }
    .sh-gold { background:linear-gradient(180deg,#bf953f,#fcf6ba,#b38728,#fbf5b7,#aa771c); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .sh-stripes { background:repeating-linear-gradient(45deg, #a084f0, #a084f0 2px, transparent 2px, transparent 6px); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .sh-rotate { display:inline-block; animation:sh-rotate 3s linear infinite; }
    @keyframes sh-rotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .sh-scramble:hover { animation:sh-scramble 0.2s steps(1) infinite; display:inline-block;}
    @keyframes sh-scramble { 0%{transform:translate(0)} 25%{transform:translate(-2px,1px)} 50%{transform:translate(2px,-1px)} 75%{transform:translate(-1px,-1px)} 100%{transform:translate(1px,1px)} }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">M</div>
      MUIRIO.DE | Shader & Box 1-Click Editor
    </div>
    <div>
      <button class="btn-primary" onclick="copyMarkdown()">📋 Markdown kopieren</button>
      <button onclick="downloadFile()">💾 Herunterladen</button>
    </div>
  </header>

  <!-- 1-Click Formatierungs-Toolbar – alle Effekte -->
  <div class="toolbar">
    <!-- Boxen -->
    <div class="toolbar-group">
      <button class="btn-green" onclick="insertEffect('green')">🟢 Grüne Box</button>
      <button class="btn-red" onclick="insertEffect('red')">🔴 Rote Box</button>
    </div>
    <!-- Textformatierung -->
    <div class="toolbar-group">
      <button onclick="insertEffect('h2')">H2</button>
      <button onclick="insertEffect('bold')"><b>B</b></button>
      <button onclick="insertEffect('italic')"><i>I</i></button>
      <button onclick="insertEffect('code')">Code</button>
    </div>
    <!-- Alle Shader-Effekte (vollständig) -->
    <div class="toolbar-group">
      <button onclick="insertEffect('rainbow')">🌈 Rainbow</button>
      <button onclick="insertEffect('glow')">✨ Glow</button>
      <button onclick="insertEffect('neon')">⚡ Neon</button>
      <button onclick="insertEffect('fire')">🔥 Fire</button>
      <button onclick="insertEffect('ice')">❄️ Ice</button>
      <button onclick="insertEffect('shadow')">👻 Shadow</button>
      <button onclick="insertEffect('outline')">✒️ Outline</button>
      <button onclick="insertEffect('gradient-bg')">🎨 Gradient</button>
      <button onclick="insertEffect('warn')">⚠️ Warn</button>
      <button onclick="insertEffect('spin')">🔄 Spin</button>
      <button onclick="insertEffect('bounce')">⬆️ Bounce</button>
      <button onclick="insertEffect('wave')">🌊 Wave</button>
      <button onclick="insertEffect('glitch')">🌀 Glitch</button>
      <button onclick="insertEffect('sparkle')">🌟 Sparkle</button>
      <button onclick="insertEffect('holo')">🔮 Holo</button>
      <button onclick="insertEffect('matrix')">💻 Matrix</button>
      <button onclick="insertEffect('void')">⬛ Void</button>
      <button onclick="insertEffect('underline-glow')">📏 U‑Glow</button>
      <button onclick="insertEffect('strike-glow')">✖️ Strike</button>
      <button onclick="insertEffect('double-line')">〰️ Double</button>
      <button onclick="insertEffect('zoom')">🔍 Zoom</button>
      <button onclick="insertEffect('pulse')">💓 Pulse</button>
      <button onclick="insertEffect('flicker')">💡 Flicker</button>
      <button onclick="insertEffect('reveal')">🔎 Reveal</button>
      <button onclick="insertEffect('blur')">🌫️ Blur</button>
      <button onclick="insertEffect('metal')">🔩 Metal</button>
      <button onclick="insertEffect('emboss')">🎨 Emboss</button>
      <button onclick="insertEffect('spotlight')">🔦 Spotlight</button>
      <button onclick="insertEffect('shade')">🌓 Shade</button>
      <button onclick="insertEffect('3d')">3D</button>
      <button onclick="insertEffect('vaporwave')">🌆 Vaporwave</button>
      <button onclick="insertEffect('cyberpunk')">🕹️ Cyberpunk</button>
      <button onclick="insertEffect('gold')">🪙 Gold</button>
      <button onclick="insertEffect('stripes')">📏 Stripes</button>
      <button onclick="insertEffect('rotate')">🔄 Rotate</button>
      <button onclick="insertEffect('scramble')">🧩 Scramble</button>
    </div>
  </div>

  <div class="main-container">
    <div class="pane">
      <div class="pane-title">Markdown Quelltext</div>
      <textarea id="editor" placeholder="Schreibe hier deinen Text oder wähle oben Effekte mit 1 Klick aus..." oninput="updatePreview()"># Willkommen im Muirio Editor
:::green
## Erlaubte Mods
* Beispiel-Mod 1
* Beispiel-Mod 2
:::

Hier ein <span class="sh-rainbow">Rainbow-Effekt</span> und ein <span class="sh-fire">Feuer-Effekt</span>!</textarea>
    </div>
    <div class="pane">
      <div class="pane-title">Live-Vorschau</div>
      <div class="preview-pane" id="preview"></div>
    </div>
  </div>

  <script>
    marked.setOptions({ breaks: true, gfm: true });

    function updatePreview() {
      const text = document.getElementById('editor').value;
      let parsed = text;
      
      // Boxen parsen
      parsed = parsed.replace(/:::green([\s\S]*?):::/g, '<div class="box-green">$1</div>');
      parsed = parsed.replace(/:::red([\s\S]*?):::/g, '<div class="box-red">$1</div>');

      document.getElementById('preview').innerHTML = marked.parse(parsed);
    }

    function insertEffect(type) {
      const ta = document.getElementById('editor');
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const sel = ta.value.substring(start, end) || 'Text';
      let snippet = '';

      switch(type) {
        case 'green':
          snippet = `:::green\n## Titel\n* ${sel}\n:::`;
          break;
        case 'red':
          snippet = `:::red\n## Warnung\n* ${sel}\n:::`;
          break;
        case 'h2':
          snippet = `## ${sel}`;
          break;
        case 'bold':
          snippet = `**${sel}**`;
          break;
        case 'italic':
          snippet = `*${sel}*`;
          break;
        case 'code':
          snippet = '`' + sel + '`';
          break;
        default:
          snippet = `<span class="sh-${type}">${sel}</span>`;
          break;
      }

      ta.value = ta.value.substring(0, start) + snippet + ta.value.substring(end);
      ta.focus();
      ta.selectionStart = start + snippet.length;
      ta.selectionEnd = start + snippet.length;
      updatePreview();
    }

    function copyMarkdown() {
      const ta = document.getElementById('editor');
      navigator.clipboard.writeText(ta.value).then(() => {
        alert('Markdown in die Zwischenablage kopiert!');
      });
    }

    function downloadFile() {
      const ta = document.getElementById('editor');
      const blob = new Blob([ta.value], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dokumentation.md';
      a.click();
      URL.revokeObjectURL(url);
    }

    // Initialer Aufruf
    updatePreview();
  </script>
</body>
</html>
