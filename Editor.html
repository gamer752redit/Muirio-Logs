<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✍️ Wiki Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0b0714;
            --bg2: #110a1f;
            --bg3: #1a1030;
            --border: #2d1f54;
            --text: #e0d8f0;
            --text2: #b8a9d4;
            --accent: #8b5cf6;
            --accent2: #a78bfa;
            --radius: 10px;
        }
        body { margin:0; font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; }
        .editor-pane, .preview-pane { flex:1; padding:20px; display:flex; flex-direction:column; }
        .editor-pane { border-right:1px solid var(--border); }
        textarea {
            flex:1;
            background:var(--bg2);
            color:var(--text);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:16px;
            font-family:'Fira Code',monospace;
            resize:none;
            font-size:0.9rem;
        }
        .preview-pane { overflow-y:auto; }
        .preview-content {
            background:var(--bg2);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:20px;
            flex:1;
            line-height:1.8;
        }
        .toolbar {
            display:flex;
            flex-wrap:wrap;
            gap:6px;
            margin-bottom:12px;
        }
        .toolbar button, .toolbar select {
            background:var(--bg3);
            color:var(--text);
            border:1px solid var(--border);
            padding:6px 12px;
            border-radius:6px;
            cursor:pointer;
            font-size:0.8rem;
            transition:0.2s;
        }
        .toolbar button:hover, .toolbar select:hover { border-color:var(--accent); background:var(--bg2); }
        .sh-rainbow { background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); background-size:200% 100%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:sh-rainbow-anim 3s linear infinite; font-weight:700; }
        @keyframes sh-rainbow-anim { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
        .sh-glow { text-shadow:0 0 10px #a78bfa,0 0 30px #8b5cf6; animation:sh-glow-pulse 2s infinite; }
        @keyframes sh-glow-pulse { 0%,100%{text-shadow:0 0 10px #a78bfa} 50%{text-shadow:0 0 25px #fff,0 0 60px #a78bfa} }
        .sh-warn { background:rgba(239,68,68,0.2); border:2px solid #ef4444; border-radius:8px; padding:12px 16px; color:#fca5a5; font-weight:600; box-shadow:0 0 25px rgba(239,68,68,0.35); animation:sh-warn-pulse 1.5s infinite; outline:3px solid rgba(239,68,68,0.5); outline-offset:2px; }
        @keyframes sh-warn-pulse { 0%,100%{box-shadow:0 0 25px rgba(239,68,68,0.35)} 50%{box-shadow:0 0 50px rgba(239,68,68,0.6)} }
        .sh-neon { text-shadow:0 0 5px #fff,0 0 10px #0ff,0 0 20px #0ff; animation:sh-neon-flicker 1.5s infinite alternate; }
        @keyframes sh-neon-flicker { 0%,19%,21%,23%,25%,54%,56%,100%{opacity:1} 20%,24%,55%{opacity:0.4} }
        .sh-fire { color:#ff6a00; text-shadow:0 0 8px #ff4500,0 0 20px #ff6347; animation:sh-fire-flicker 0.8s infinite alternate; }
        @keyframes sh-fire-flicker { 0%{text-shadow:0 0 8px #ff4500} 100%{text-shadow:0 0 15px #ffa500,0 0 35px #ff4500} }
        .sh-ice { color:#a0d8ef; text-shadow:0 0 8px #87ceeb; animation:sh-ice-shimmer 2s infinite; }
        @keyframes sh-ice-shimmer { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.5)} }
        .sh-shadow { text-shadow:3px 3px 0 rgba(0,0,0,0.5),6px 6px 0 rgba(139,92,246,0.3); }
        .sh-outline { color:#fff; -webkit-text-stroke:2px var(--accent); }
        .sh-gradient-bg { background:linear-gradient(135deg,#8b5cf6,#ec4899); padding:4px 10px; border-radius:5px; color:#fff; font-weight:600; }
        .sh-spin { display:inline-block; animation:sh-spin-anim 2s linear infinite; }
        @keyframes sh-spin-anim { to{transform:rotate(360deg)} }
        .sh-bounce { display:inline-block; animation:sh-bounce-anim 0.6s ease-in-out infinite alternate; }
        @keyframes sh-bounce-anim { 0%{transform:translateY(0)} 100%{transform:translateY(-12px)} }
        .sh-wave { display:inline-block; animation:sh-wave-anim 1.5s ease-in-out infinite; }
        @keyframes sh-wave-anim { 0%,100%{transform:translateY(0)} 25%{transform:translateY(-8px)} 75%{transform:translateY(4px)} }
        .sh-glitch { position:relative; animation:sh-glitch-anim 0.3s infinite; }
        @keyframes sh-glitch-anim { 0%,100%{transform:translate(0)} 20%{transform:translate(-3px,2px)} 40%{transform:translate(3px,-2px)} 60%{transform:translate(-1px,-1px)} 80%{transform:translate(1px,1px)} }
        .sh-sparkle { background:linear-gradient(90deg,#ffd700,#fff8dc,#ffd700); background-size:200% 100%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:sh-sparkle-anim 2s linear infinite; }
        @keyframes sh-sparkle-anim { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
        .sh-holo { background:linear-gradient(135deg,#ff0080,#ff8c00,#40e0d0,#ff0080); background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:sh-holo-anim 4s ease infinite; }
        @keyframes sh-holo-anim { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
        .sh-matrix { color:#0f0; text-shadow:0 0 8px #0f0; font-family:monospace; }
        .sh-void { color:#000; background:#fff; padding:2px 6px; border-radius:3px; font-weight:700; }
        .sh-underline-glow { border-bottom:2px solid var(--accent); box-shadow:0 2px 15px rgba(139,92,246,0.4); text-decoration:none; }
        .sh-strike-glow { text-decoration:line-through; text-decoration-color:var(--accent); text-decoration-thickness:2px; text-shadow:0 0 8px var(--accent); }
        .sh-double-line { border-top:2px solid var(--accent2); border-bottom:2px solid var(--accent2); padding:4px 0; display:inline-block; }
        .sh-zoom { display:inline-block; animation:sh-zoom-anim 2s ease-in-out infinite; }
        @keyframes sh-zoom-anim { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
    </style>
</head>
<body>
<div class="editor-pane">
    <div class="toolbar">
        <select id="shaderSelect">
            <option value="">🎨 Shader wählen...</option>
            <option value="sh-rainbow">🌈 Rainbow</option>
            <option value="sh-glow">✨ Glow</option>
            <option value="sh-neon">💡 Neon</option>
            <option value="sh-fire">🔥 Fire</option>
            <option value="sh-ice">❄️ Ice</option>
            <option value="sh-shadow">👤 Shadow</option>
            <option value="sh-outline">🖊️ Outline</option>
            <option value="sh-gradient-bg">🎨 Gradient BG</option>
            <option value="sh-warn">⚠️ Warnung</option>
            <option value="sh-spin">🔄 Spin</option>
            <option value="sh-bounce">⬆️ Bounce</option>
            <option value="sh-wave">🌊 Wave</option>
            <option value="sh-glitch">🤖 Glitch</option>
            <option value="sh-sparkle">✨ Sparkle</option>
            <option value="sh-holo">💿 Holo</option>
            <option value="sh-matrix">🟢 Matrix</option>
            <option value="sh-void">⬛ Void</option>
            <option value="sh-underline-glow">🔗 Underline Glow</option>
            <option value="sh-strike-glow">❌ Strike Glow</option>
            <option value="sh-double-line">⏸️ Double Line</option>
            <option value="sh-zoom">🔍 Zoom</option>
        </select>
        <button onclick="applyShader()">Anwenden</button>
        <button onclick="copyToClipboard()">📋 Kopieren</button>
    </div>
    <textarea id="editor" placeholder="Schreibe dein Markdown hier... Markiere Text, um Shader anzuwenden.">
# Willkommen im Editor

Das ist ein **Beispieltext**. Markiere einen Textbereich und wähle einen Shader aus der Liste.

> ⚠️ **Warnung:** Dieser Text ist mit `sh-warn` formatiert.

🌈 <span class="sh-rainbow">Regenbogen-Text</span>
✨ <span class="sh-glow">Leuchtender Text</span>
    </textarea>
</div>
<div class="preview-pane">
    <h3 style="margin-top:0;">📄 Vorschau</h3>
    <div class="preview-content" id="preview"></div>
</div>

<script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const shaderSelect = document.getElementById('shaderSelect');

    marked.setOptions({ breaks:true, gfm:true, sanitize:false });

    function updatePreview() {
        preview.innerHTML = marked.parse(editor.value);
    }

    editor.addEventListener('input', updatePreview);
    updatePreview();

    function applyShader() {
        const shader = shaderSelect.value;
        if (!shader) return alert('Bitte einen Shader auswählen.');
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        if (start === end) return alert('Bitte Text markieren.');
        const selectedText = editor.value.substring(start, end);
        const wrapped = `<span class="${shader}">${selectedText}</span>`;
        editor.setRangeText(wrapped, start, end, 'select');
        editor.focus();
        updatePreview();
    }

    function copyToClipboard() {
        navigator.clipboard.writeText(editor.value).then(() => alert('✅ In die Zwischenablage kopiert!'));
    }
</script>
</body>
</html>
