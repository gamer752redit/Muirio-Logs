<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUIRIO.DE | Dokumentation</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --bg-main: #0b0f19;
      --bg-sidebar: #0f172a;
      --bg-topbar: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --border: #334155;
      --text-main: #cbd5e1;
      --text-heading: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #8b5cf6;
      --accent-hover: #a78bfa;
      --accent-glow: rgba(139, 92, 246, 0.25);
      
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --sidebar-w: 280px;
      --topbar-h: 64px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height: 100vh; font-family: var(--font-ui); background: var(--bg-main); color: var(--text-main); overflow: hidden; scroll-behavior: smooth; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb-hover { background: var(--accent); }

    /* ── TOPBAR ── */
    #topbar {
      height: var(--topbar-h); background: var(--bg-topbar); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 32px; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 1.1rem; color: var(--text-heading); cursor: pointer; }
    .brand-logo { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), #c084fc); border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; box-shadow: 0 0 15px var(--accent-glow); }
    
    .top-nav { display: flex; gap: 20px; font-size: 0.9rem; align-items: center; }
    .search-bar { background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 8px; outline: none; width: 260px; transition: all 0.2s; }
    .search-bar:focus { border-color: var(--accent); width: 320px; box-shadow: 0 0 12px var(--accent-glow); }
    .impressum-link { color: var(--text-muted); cursor: pointer; font-size: 0.88rem; transition: color 0.2s; }
    .impressum-link:hover { color: var(--text-heading); }

    /* ── LAYOUT ── */
    #app-body { display: flex; height: calc(100vh - var(--topbar-h)); position: relative; }

    /* ── SIDEBAR ── */
    #sidebar { width: var(--sidebar-w); background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
    .sidebar-title { padding: 20px 24px 10px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); font-weight: 700; }
    .sidebar-tree { flex: 1; overflow-y: auto; padding: 10px 14px; }
    
    .tree-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer;
      color: var(--text-main); font-size: 0.88rem; border-radius: 6px; margin-bottom: 3px; transition: all 0.15s;
    }
    .tree-row:hover { background: var(--bg-card); color: var(--text-heading); }
    .tree-row.active { background: rgba(139, 92, 246, 0.15); color: #c084fc; border-left: 3px solid var(--accent); font-weight: 500; }

    /* ── VIEWER CONTAINER (Layout with Document + Notion TOC) ── */
    #docs-viewer { flex: 1; padding: 40px 50px; overflow-y: auto; display: flex; justify-content: center; background: var(--bg-main); gap: 40px; }
    .doc-content { width: 100%; max-width: 800px; }

    /* ── NOTION STYLE RIGHT TOC OUTLINE ── */
    #notion-toc {
      width: 260px; min-width: 260px; position: sticky; top: 0; height: fit-content; max-height: calc(100vh - 120px);
      overflow-y: auto; padding: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      font-size: 0.85rem; display: none;
    }
    #notion-toc.visible { display: block; }
    .toc-item { display: block; padding: 5px 8px; border-radius: 4px; cursor: pointer; color: var(--text-muted); text-decoration: none; transition: all 0.15s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toc-item:hover { background: var(--bg-card-hover); color: var(--text-heading); }
    .toc-h1 { font-weight: 600; color: var(--text-heading); margin-top: 6px; }
    .toc-h2 { margin-left: 14px; font-size: 0.78rem; opacity: 0.85; border-left: 2px solid var(--border); padding-left: 8px; margin-top: 2px; }

    /* ── LANDING PAGE (ROOT FOLDERS ONLY) ── */
    .landing-hero { margin-bottom: 40px; padding-bottom: 30px; border-bottom: 1px solid var(--border); }
    .landing-hero h1 { font-size: 2.8rem; color: var(--text-heading); margin-bottom: 12px; font-weight: 700; letter-spacing: -0.5px; }
    .landing-hero p { color: var(--text-muted); font-size: 1.1rem; line-height: 1.6; }

    .section-title { font-size: 1.25rem; color: var(--text-heading); margin-bottom: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    
    .folders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .folder-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 26px;
      cursor: pointer; transition: all 0.25s ease; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
    }
    .folder-card:hover { background: var(--bg-card-hover); border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow); }
    .folder-card-icon { font-size: 2.2rem; margin-bottom: 4px; }
    .folder-card h3 { font-size: 1.2rem; color: var(--text-heading); font-weight: 600; }
    .folder-card p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; margin: 0; }
    .folder-card-badge { position: absolute; top: 20px; right: 20px; font-size: 0.75rem; background: rgba(139, 92, 246, 0.2); border: 1px solid rgba(139, 92, 246, 0.4); padding: 3px 10px; border-radius: 20px; color: #c084fc; font-weight: 500; }

    /* ── SUB-PAGE & IMPRESSUM STYLING ── */
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }
    .breadcrumb span { cursor: pointer; color: var(--accent); }
    .breadcrumb span:hover { text-decoration: underline; }

    .meta-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .back-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; }
    .back-btn:hover { background: var(--bg-card-hover); color: var(--text-heading); border-color: var(--accent); }

    /* Dezenter Edit-Button am Seitenende */
    .subtle-edit-container { margin-top: 50px; padding-top: 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
    .subtle-edit-btn {
      background: transparent; border: 1px dashed var(--border); color: var(--text-muted); padding: 6px 14px;
      border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px;
    }
    .subtle-edit-btn:hover { background: rgba(139, 92, 246, 0.08); border-color: var(--accent); color: var(--text-heading); }

    /* NOTION STYLE HEADINGS (H1 prominent, H2 smaller & indented style) */
    .doc-body h1 { font-size: 2.5rem; color: var(--text-heading); margin-bottom: 0.5em; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; scroll-margin-top: 30px; }
    .doc-body h2 {
      font-size: 1.25rem; color: var(--text-muted); margin-top: 1.8em; margin-bottom: 0.5em; font-weight: 600;
      padding-left: 12px; border-left: 3px solid var(--border); scroll-margin-top: 30px; transition: color 0.2s;
    }
    .doc-body h2:hover { color: var(--text-heading); border-left-color: var(--accent); }
    .doc-body h3 { font-size: 1.1rem; color: var(--text-heading); margin-top: 1.4em; margin-bottom: 0.5em; scroll-margin-top: 30px; }
    
    .doc-body p, .doc-body li { line-height: 1.75; margin-bottom: 1em; color: var(--text-main); font-size: 0.98rem; }
    .doc-body ul, .doc-body ol { margin-bottom: 1em; padding-left: 20px; }
    .doc-body a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .doc-body a:hover { text-decoration: underline; }
    .doc-body strong { color: var(--text-heading); }
    
    .doc-body blockquote {
      background: rgba(139, 92, 246, 0.08); border-left: 4px solid var(--accent);
      padding: 16px 20px; border-radius: 0 8px 8px 0; margin: 1.5em 0; color: var(--text-muted);
    }
    .doc-body pre { background: #07090f; padding: 18px; border-radius: 10px; overflow-x: auto; margin-bottom: 1.5em; border: 1px solid var(--border); }
    .doc-body code { font-family: var(--font-mono); font-size: 0.85em; background: rgba(139, 92, 246, 0.15); color: #c084fc; padding: 2px 6px; border-radius: 4px; }
    .doc-body pre code { background: none; padding: 0; color: var(--text-main); }
    .doc-body img { max-width: 100%; border-radius: 10px; margin: 1em 0; border: 1px solid var(--border); }

    /* ── GREEN & RED COMPONENT BOXES ── */
    .doc-body .box-green {
      background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.3); border-left: 4px solid #10b981;
      padding: 22px; border-radius: 0 10px 10px 0; margin: 1.8em 0; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.1);
    }
    .doc-body .box-green h2, .doc-body .box-green h3 { color: #34d399; border-left-color: #10b981; }
    .doc-body .box-green strong { color: #6ee7b7; }

    .doc-body .box-red {
      background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3); border-left: 4px solid #ef4444;
      padding: 22px; border-radius: 0 10px 10px 0; margin: 1.8em 0; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.1);
    }
    .doc-body .box-red h2, .doc-body .box-red h3 { color: #f87171; border-left-color: #ef4444; }
    .doc-body .box-red strong { color: #fca5a5; }

    /* ── IMPRESSUM STYLING ── */
    .impressum-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 35px; max-width: 750px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .impressum-container h2 { font-size: 1.8rem; color: var(--text-heading); margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px; border-left: none; padding-left: 0; }
    .impressum-grid { display: grid; grid-template-columns: 180px 1fr; gap: 16px; margin-bottom: 20px; font-size: 0.95rem; align-items: baseline; }
    .impressum-label { font-weight: 600; color: var(--text-muted); }
    .impressum-value { color: var(--text-heading); line-height: 1.5; }
    .legal-wall { margin-top: 30px; background: rgba(239, 68, 68, 0.06); border: 1px solid rgba(239, 68, 68, 0.25); border-left: 4px solid #ef4444; padding: 22px; border-radius: 0 10px 10px 0; }
    .legal-wall h3 { color: #f87171; font-size: 1.1rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .legal-wall p { color: var(--text-main); font-size: 0.92rem; line-height: 1.6; margin-bottom: 10px; }
    .legal-wall p:last-child { margin-bottom: 0; }

    /* ── EDITOR STYLES ── */
    .editor-container { display: flex; flex-direction: column; gap: 16px; width: 100%; }
    .editor-toolbar { display: flex; flex-wrap: wrap; gap: 8px; background: var(--bg-card); padding: 12px; border: 1px solid var(--border); border-radius: 10px; }
    .editor-toolbar button { background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: 500; transition: 0.15s; display: inline-flex; align-items: center; gap: 4px; }
    .editor-toolbar button:hover { background: var(--bg-card-hover); color: var(--text-heading); border-color: var(--accent); }
    .editor-toolbar button.btn-green-tool { border-color: rgba(16, 185, 129, 0.4); color: #34d399; background: rgba(16, 185, 129, 0.1); }
    .editor-toolbar button.btn-green-tool:hover { background: rgba(16, 185, 129, 0.2); }
    .editor-toolbar button.btn-red-tool { border-color: rgba(239, 68, 68, 0.4); color: #f87171; background: rgba(239, 68, 68, 0.1); }
    .editor-toolbar button.btn-red-tool:hover { background: rgba(239, 68, 68, 0.2); }

    .editor-split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 550px; }
    @media(max-width: 1100px) { .editor-split { grid-template-columns: 1fr; height: auto; } }
    
    .editor-textarea { width: 100%; height: 100%; min-height: 400px; background: #07090f; border: 1px solid var(--border); border-radius: 10px; padding: 16px; color: #f8fafc; font-family: var(--font-mono); font-size: 0.88rem; line-height: 1.6; resize: vertical; outline: none; transition: border-color 0.2s; }
    .editor-textarea:focus { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
    .editor-preview-pane { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; overflow-y: auto; height: 100%; }

    /* ══════════ SHADER & EFFEKTE ══════════ */
    .sh-rainbow { background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); background-size:200%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:sh-rainbow 3s linear infinite; font-weight:700; }
    @keyframes sh-rainbow { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
    .sh-glow { text-shadow:0 0 8px #a084f0,0 0 20px #7c5af5; animation:sh-glow 2s infinite alternate; }
    @keyframes sh-glow { from{text-shadow:0 0 8px #a084f0} to{text-shadow:0 0 20px #fff,0 0 35px #a084f0} }
    .sh-neon { text-shadow:0 0 5px #fff,0 0 15px #0ff,0 0 30px #0ff; animation:sh-neon 1.5s infinite alternate; }
    @keyframes sh-neon { 0%,19%,21%,23%,25%,54%,56%,100%{opacity:1} 20%,24%,55%{opacity:0.4} }
    .sh-fire { color:#ff6a00; text-shadow:0 0 8px #ff4500,0 0 20px #ff6347; animation:sh-fire 0.8s infinite alternate; }
    @keyframes sh-fire { from{text-shadow:0 0 8px #ff4500} to{text-shadow:0 0 15px #ffa500,0 0 35px #ff4500} }
    .sh-ice { color:#a0d8ef; text-shadow:0 0 8px #87ceeb; animation:sh-ice 2s ease-in-out infinite; }
    @keyframes sh-ice { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.4)} }
  </style>
</head>
<body>

  <header id="topbar">
    <div class="brand" onclick="goHome()">
      <div class="brand-logo">M</div>
      MUIRIO.DE | Docs
    </div>
    <div class="top-nav">
      <input type="text" class="search-bar" placeholder="⌕ Dokumente durchsuchen..." id="searchInput" oninput="handleSearch(this.value)">
      <span class="impressum-link" onclick="openImpressum()">Impressum</span>
    </div>
  </header>

  <div id="app-body">
    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="sidebar-title">Explorer</div>
      <div class="sidebar-tree" id="treeNav">
        <div style="padding: 10px 14px; color: var(--text-muted);">Lade Struktur...</div>
      </div>
    </aside>

    <!-- VIEWER CONTAINER -->
    <main id="docs-viewer">
      <div class="doc-content" id="preview">
        <!-- Dynamischer Inhalt -->
      </div>
      <!-- Notion Style Right Outline TOC -->
      <nav id="notion-toc">
        <!-- Generierte Inhaltsübersicht -->
      </nav>
    </main>
  </div>

  <script>
    marked.setOptions({ breaks: true, gfm: true });
    const preview = document.getElementById('preview');
    const notionToc = document.getElementById('notion-toc');

    const GITHUB_USER = 'gamer752redit';
    const GITHUB_REPO = 'Muirio-Logs';
    const API = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`;

    let allFilesMap = new Map();
    let treeFolders = [];
    let expanded = {};

    // 1. Repository-Struktur rekursiv laden
    async function fetchDir(path = '') {
      try {
        const resp = await fetch(`${API}/${path}`);
        if (!resp.ok) return [];
        const items = await resp.json();
        const out = [];
        for (const i of items) {
          if (i.type === 'dir') {
            const children = await fetchDir(i.path);
            out.push({ type: 'folder', name: i.name, path: i.path, children });
          } else if (path !== '') {
            const ext = i.name.split('.').pop().toLowerCase();
            const fileObj = { type: 'file', name: i.name, path: i.path, download_url: i.download_url, ext };
            allFilesMap.set(i.path, fileObj);
            
            if (ext === 'md') {
              out.push(fileObj);
            }
          }
        }
        return out;
      } catch (err) {
        console.error("GitHub API Fehler:", err);
        return [];
      }
    }

    async function initGitHub() {
      treeFolders = await fetchDir();
      renderSidebar();
      handleRoute();
    }

    // 2. Sidebar Zeichnen
    function renderSidebar() {
      const nav = document.getElementById('treeNav');
      let html = '';
      
      function walk(items, depth = 0) {
        for (const item of items) {
          if (item.type === 'folder') {
            const open = expanded[item.path] === true;
            html += `
              <div class="tree-row" style="padding-left:${10 + depth * 14}px" onclick="event.stopPropagation(); toggleFolder('${item.path}')">
                <span style="font-size:0.65rem; opacity:0.6;">${open ? '▼' : '▶'}</span> 📁 ${item.name}
              </div>
              <div style="display: ${open ? 'block' : 'none'};">
            `;
            if (item.children) walk(item.children, depth + 1);
            html += `</div>`;
          } else if (item.ext === 'md') {
            const isCurrent = window.location.hash.slice(1) === item.path;
            const isActive = isCurrent ? 'active' : '';
            html += `
              <div class="tree-row ${isActive}" style="padding-left:${24 + depth * 14}px" onclick="navigateTo('${item.path}')">
                📄 ${item.name.replace(/\.md$/, '')}
              </div>`;
          }
        }
      }
      
      if (treeFolders.length === 0) {
        html = '<div style="padding: 14px; color: var(--text-muted);">Keine Ordner gefunden.</div>';
      } else {
        walk(treeFolders);
      }
      nav.innerHTML = html;
    }

    function toggleFolder(path) {
      expanded[path] = !expanded[path];
      renderSidebar();
    }

    // 3. Routing-System
    window.addEventListener('hashchange', handleRoute);

    function navigateTo(path) {
      window.location.hash = path;
    }

    function goHome() {
      window.location.hash = '';
    }

    function openImpressum() {
      window.location.hash = 'impressum';
    }

    async function handleRoute() {
      const hash = window.location.hash.slice(1);
      renderSidebar();

      if (!hash) {
        notionToc.classList.remove('visible');
        renderLandingPage();
      } else if (hash === 'impressum') {
        notionToc.classList.remove('visible');
        renderImpressumPage();
      } else {
        const file = allFilesMap.get(hash);
        if (file) {
          await renderFilePage(file);
        } else {
          notionToc.classList.remove('visible');
          preview.innerHTML = `
            <div class="breadcrumb"><span onclick="goHome()">Übersicht</span> / <span>Nicht gefunden</span></div>
            <h1>404 - Seite nicht gefunden</h1>
            <p>Die angeforderte Datei existiert nicht oder wurde verschoben.</p>
            <button class="back-btn" onclick="goHome()" style="margin-top:20px;">Zur Startseite</button>
          `;
        }
      }
    }

    // 4. Landing Page
    function renderLandingPage() {
      const rootFolders = treeFolders.filter(i => i.type === 'folder');

      let cardsHtml = '';
      if (rootFolders.length === 0) {
        cardsHtml = '<p style="color:var(--text-muted);">Keine Root-Ordner im Repository gefunden.</p>';
      } else {
        for (const folder of rootFolders) {
          const fileCount = countFilesInFolder(folder);
          cardsHtml += `
            <div class="folder-card" onclick="openRootFolder('${folder.path}')">
              <div class="folder-card-badge">${fileCount} Docs</div>
              <div class="folder-card-icon">📂</div>
              <h3>${folder.name}</h3>
              <p>Hauptkategorie durchsuchen und Unterseiten einsehen.</p>
            </div>
          `;
        }
      }

      preview.innerHTML = `
        <div class="landing-hero">
          <h1>Muirio Dokumentation</h1>
          <p>Wähle einen der Root-Ordner aus, um direkt in die jeweiligen Dokumentationen einzusteigen.</p>
        </div>
        <h2 class="section-title">📁 Hauptkategorien</h2>
        <div class="folders-grid">
          ${cardsHtml}
        </div>
      `;
    }

    function countFilesInFolder(folder) {
      let count = 0;
      if (folder.children) {
        for (const c of folder.children) {
          if (c.type === 'file' && c.ext === 'md') count++;
          if (c.type === 'folder') count += countFilesInFolder(c);
        }
      }
      return count;
    }

    function openRootFolder(path) {
      expanded[path] = true;
      renderSidebar();
      const folder = treeFolders.find(i => i.path === path);
      if (folder && folder.children) {
        const firstFile = findFirstFile(folder);
        if (firstFile) navigateTo(firstFile.path);
      }
    }

    function findFirstFile(item) {
      if (item.type === 'file' && item.ext === 'md') return item;
      if (item.children) {
        for (const child of item.children) {
          const found = findFirstFile(child);
          if (found) return found;
        }
      }
      return null;
    }

    // Markdown Parser Hilfsfunktion mit Asset-Einbettung & Boxen
    function parseMarkdownWithAssets(md, file) {
      const dirPath = file.path.includes('/') ? file.path.substring(0, file.path.lastIndexOf('/') + 1) : '';

      for (let [path, asset] of allFilesMap.entries()) {
        if (path.startsWith(dirPath) && path !== file.path && !path.substring(dirPath.length).includes('/')) {
          const assetName = asset.name;
          const assetExt = asset.ext;
          let replacement = '';

          if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(assetExt)) {
            replacement = `<img src="${asset.download_url}" alt="${assetName}" style="max-width:100%; border-radius:10px; margin:1.2em 0; border:1px solid var(--border);">`;
          } else if (['mp4', 'mov', 'webm'].includes(assetExt)) {
            replacement = `<video controls style="width:100%; border-radius:10px; margin:1.2em 0; border:1px solid var(--border);"><source src="${asset.download_url}"></video>`;
          } else if (['mp3', 'wav', 'ogg'].includes(assetExt)) {
            replacement = `<audio controls style="width:100%; margin:1.2em 0;"><source src="${asset.download_url}"></audio>`;
          }

          if (replacement) {
            const escapedName = assetName.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            md = md.replace(new RegExp(`!\\[([^\\]]*)\\]\\((?:\\./)?${escapedName}\\)`, 'g'), replacement);
            md = md.replace(new RegExp(`\\[([^\\]]*)\\]\\((?:\\./)?${escapedName}\\)`, 'g'), replacement);
            md = md.replace(new RegExp(`\\b${escapedName}\\b`, 'g'), replacement);
          }
        }
      }

      md = md.replace(/:::green([\s\S]*?):::/g, '<div class="box-green">$1</div>');
      md = md.replace(/:::red([\s\S]*?):::/g, '<div class="box-red">$1</div>');

      return marked.parse(md);
    }

    // 6. Markdown Unterseite Rendern
    async function renderFilePage(file) {
      if (file.ext === 'md') {
        preview.innerHTML = `<h2 style='color:var(--text-muted);'>Lade Unterseite...</h2>`;
        notionToc.classList.remove('visible');
        
        let md = sessionStorage.getItem('md:' + file.path);
        if (!md) {
          const resp = await fetch(file.download_url);
          md = await resp.text();
          sessionStorage.setItem('md:' + file.path, md);
        }

        const pathParts = file.path.split('/');
        const breadcrumbName = file.name.replace(/\.md$/, '');
        
        preview.innerHTML = `
          <div class="breadcrumb">
            <span onclick="goHome()">Übersicht</span> / <span>${pathParts.length > 1 ? pathParts[0] : ''}</span> / <span>${breadcrumbName}</span>
          </div>
          <div class="meta-bar">
            <button class="back-btn" onclick="goHome()">← Zurück zur Übersicht</button>
            <span>Pfad: /${file.path}</span>
          </div>
          <div class="doc-body">
            ${parseMarkdownWithAssets(md, file)}
          </div>
          <div class="subtle-edit-container">
            <button class="subtle-edit-btn" onclick="openEditorMode('${file.path}')">✏️ Diese Seite bearbeiten</button>
          </div>
        `;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // Notion TOC Generator nach dem Rendern aufbauen
        setTimeout(buildNotionToc, 50);
      } else {
        notionToc.classList.remove('visible');
        preview.innerHTML = `
          <div class="breadcrumb"><span onclick="goHome()">Übersicht</span> / <span>${file.name}</span></div>
          <button class="back-btn" onclick="goHome()" style="margin-bottom:20px;">← Zurück</button>
          <h1>${file.name}</h1>
          <p><a href="${file.download_url}" target="_blank" style="color:var(--accent);">Datei herunterladen</a></p>
        `;
      }
    }

    // 7. Notion-Style Inhaltsverzeichnis (TOC) erstellen
    function buildNotionToc() {
      const docBody = document.querySelector('.doc-body');
      if (!docBody) {
        notionToc.classList.remove('visible');
        return;
      }

      const headings = docBody.querySelectorAll('h1, h2');
      if (headings.length === 0) {
        notionToc.classList.remove('visible');
        return;
      }

      let tocHtml = '<div style="font-weight:600; font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; color:var(--text-muted);">Auf dieser Seite</div>';

      headings.forEach((h, index) => {
        if (!h.id) {
          h.id = 'notion-heading-' + index;
        }
        const text = h.innerText;
        const isH2 = h.tagName === 'H2';
        const className = isH2 ? 'toc-item toc-h2' : 'toc-item toc-h1';

        tocHtml += `<a class="${className}" onclick="smoothScrollToHeader('${h.id}')" title="${text}">${text}</a>`;
      });

      notionToc.innerHTML = tocHtml;
      notionToc.classList.add('visible');
    }

    function smoothScrollToHeader(id) {
      const target = document.getElementById(id);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        target.style.transition = 'color 0.3s ease';
        target.style.color = 'var(--accent)';
        setTimeout(() => {
          target.style.color = '';
        }, 1200);
      }
    }

    // 8. Editor-Modus (integriert)
    function openEditorMode(path) {
      notionToc.classList.remove('visible');
      const file = allFilesMap.get(path);
      const mdContent = sessionStorage.getItem('md:' + path) || '';
      const pathParts = path.split('/');
      const breadcrumbName = file.name.replace(/\.md$/, '');

      preview.innerHTML = `
        <div class="breadcrumb">
          <span onclick="goHome()">Übersicht</span> / <span>${pathParts.length > 1 ? pathParts[0] : ''}</span> / <span>${breadcrumbName} (Editor)</span>
        </div>
        <div class="meta-bar">
          <button class="back-btn" onclick="navigateTo('${path}')">← Zurück zur Ansicht</button>
          <div class="btn-group" style="display:flex; gap:10px;">
            <button class="back-btn" onclick="saveEditorContent('${path}')">💾 Speichern</button>
            <button class="back-btn" style="border-color:rgba(139,92,246,0.4); color:#c084fc;" onclick="copyEditorMarkdown()">📋 Markdown kopieren</button>
          </div>
        </div>
        <div class="editor-container">
          <div class="editor-toolbar">
            <button class="btn-green-tool" onclick="insertFormat('green')">🟢 Grüne Box</button>
            <button class="btn-red-tool" onclick="insertFormat('red')">🔴 Rote Box</button>
            <button onclick="insertFormat('h2')">H2</button>
            <button onclick="insertFormat('bold')"><b>B</b></button>
            <button onclick="insertFormat('italic')"><i>I</i></button>
            <button onclick="insertFormat('code')">&lt;/&gt; Code</button>
            <button onclick="insertFormat('link')">🔗 Link</button>
            <button onclick="insertFormat('ul')">• Liste</button>
          </div>

          <div class="editor-split">
            <textarea id="markdownEditor" class="editor-textarea" oninput="updateLivePreview('${path}')">${mdContent}</textarea>
            <div class="editor-preview-pane doc-body" id="editorPreviewPane">
              ${parseMarkdownWithAssets(mdContent, file)}
            </div>
          </div>
        </div>
      `;
    }

    function insertFormat(type) {
      const ta = document.getElementById('markdownEditor');
      if (!ta) return;
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const selectedText = ta.value.substring(start, end);
      let replacement = '';

      switch(type) {
        case 'green':
          replacement = `:::green\n## Titel\n* ${selectedText || 'Hier Text eingeben...'}\n:::`;
          break;
        case 'red':
          replacement = `:::red\n## Warnung\n* ${selectedText || 'Hier Text eingeben...'}\n:::`;
          break;
        case 'h2':
          replacement = `## ${selectedText || 'Überschrift'}`;
          break;
        case 'bold':
          replacement = `**${selectedText || 'fett'}**`;
          break;
        case 'italic':
          replacement = `*${selectedText || 'kursiv'}*`;
          break;
        case 'code':
          replacement = '`' + (selectedText || 'code') + '`';
          break;
        case 'link':
          replacement = `[${selectedText || 'Link Text'}](https://url.de)`;
          break;
        case 'ul':
          replacement = `- ${selectedText || 'Listenpunkt'}`;
          break;
      }

      ta.value = ta.value.substring(0, start) + replacement + ta.value.substring(end);
      ta.focus();
      ta.selectionStart = start + replacement.length;
      ta.selectionEnd = start + replacement.length;

      const currentHash = window.location.hash.slice(1);
      updateLivePreview(currentHash);
    }

    function updateLivePreview(path) {
      const ta = document.getElementById('markdownEditor');
      const pane = document.getElementById('editorPreviewPane');
      if (!ta || !pane) return;
      const file = allFilesMap.get(path);
      sessionStorage.setItem('md:' + path, ta.value);
      pane.innerHTML = parseMarkdownWithAssets(ta.value, file);
    }

    function saveEditorContent(path) {
      const ta = document.getElementById('markdownEditor');
      if (!ta) return;
      sessionStorage.setItem('md:' + path, ta.value);
      alert('Dokument erfolgreich aktualisiert und gespeichert!');
      navigateTo(path);
    }

    function copyEditorMarkdown() {
      const ta = document.getElementById('markdownEditor');
      if (!ta) return;
      navigator.clipboard.writeText(ta.value).then(() => {
        alert('Markdown in die Zwischenablage kopiert!');
      });
    }

    // Live-Suche
    function handleSearch(query) {
      const q = query.toLowerCase();
      if (!q) {
        handleRoute();
        return;
      }
      
      notionToc.classList.remove('visible');
      let resultsHtml = `<h2 class="section-title">Suchergebnisse für "${query}"</h2><div class="folders-grid">`;
      let foundCount = 0;
      
      for (const [path, file] of allFilesMap.entries()) {
        if (file.ext === 'md' && file.name.toLowerCase().includes(q)) {
          foundCount++;
          resultsHtml += `
            <div class="folder-card" onclick="navigateTo('${file.path}')">
              <div class="folder-card-icon">📄</div>
              <h3>${file.name}</h3>
              <p>Pfad: ${file.path}</p>
            </div>
          `;
        }
      }
      
      if (foundCount === 0) {
        resultsHtml += `<p style="color:var(--text-muted);">Keine passenden Dokumente gefunden.</p>`;
      }
      resultsHtml += `</div>`;
      preview.innerHTML = resultsHtml;
    }

    // Start
    initGitHub();
  </script>
