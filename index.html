<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 WikiDash</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0b0714;
            --bg2: #110a1f;
            --bg3: #1a1030;
            --bg4: #221840;
            --border: #2d1f54;
            --text: #e0d8f0;
            --text2: #b8a9d4;
            --muted: #7b6b9e;
            --accent: #8b5cf6;
            --accent2: #a78bfa;
            --red: #ef4444;
            --radius: 10px;
            --radius2: 16px;
            --font: 'Segoe UI', system-ui, sans-serif;
            --mono: 'Fira Code', 'JetBrains Mono', monospace;
            --side-w: 275px;
            --top-h: 52px;
            --trans: 0.2s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; font-size:14.5px; }
        body {
            font-family:var(--font);
            background:var(--bg);
            color:var(--text);
            display:flex;
            min-height:100vh;
            overflow-x:hidden;
            -webkit-font-smoothing:antialiased;
        }
        ::-webkit-scrollbar { width:5px; height:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }

        #sidebar {
            width:var(--side-w);
            min-width:var(--side-w);
            height:100vh;
            background:var(--bg2);
            border-right:1px solid var(--border);
            display:flex;
            flex-direction:column;
            z-index:100;
            position:sticky;
            top:0;
            left:0;
        }
        .side-top {
            padding:12px 16px;
            border-bottom:1px solid var(--border);
            display:flex;
            align-items:center;
            gap:10px;
            min-height:var(--top-h);
        }
        .logo {
            font-weight:800;
            font-size:1.1rem;
            background:linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            cursor:pointer;
        }
        .side-tree {
            flex:1;
            overflow-y:auto;
            padding:8px 6px;
            font-size:0.8rem;
        }
        .tree-item {
            display:flex;
            align-items:center;
            gap:6px;
            padding:5px 10px;
            border-radius:5px;
            cursor:pointer;
            transition:var(--trans);
            color:var(--text2);
            border:1px solid transparent;
            white-space:nowrap;
            user-select:none;
        }
        .tree-item:hover { background:var(--bg3); color:var(--text); }
        .tree-item.active {
            background:rgba(139,92,246,0.2);
            color:var(--accent2);
            border-color:rgba(139,92,246,0.4);
            font-weight:600;
        }
        .tree-item .icon { width:18px; text-align:center; }
        .tree-children { padding-left:18px; overflow:hidden; transition:max-height 0.3s; }
        .tree-children.collapsed { max-height:0!important; }
        .side-bottom {
            padding:10px 14px;
            border-top:1px solid var(--border);
            font-size:0.7rem;
            color:var(--muted);
            display:flex;
            justify-content:space-between;
        }

        #main { flex:1; display:flex; flex-direction:column; overflow-y:auto; }
        #topbar {
            height:var(--top-h);
            min-height:var(--top-h);
            border-bottom:1px solid var(--border);
            display:flex;
            align-items:center;
            padding:0 18px;
            gap:12px;
            background:var(--bg2);
            position:sticky;
            top:0;
            z-index:50;
        }
        #burger {
            display:none;
            background:none;
            border:1px solid var(--border);
            color:var(--text);
            font-size:1.3rem;
            cursor:pointer;
            padding:4px 10px;
            border-radius:6px;
        }
        #breadcrumb { flex:1; font-size:0.8rem; color:var(--muted); display:flex; gap:4px; align-items:center; }
        #breadcrumb span { cursor:pointer; padding:3px 7px; border-radius:4px; }
        #breadcrumb span:hover { color:var(--accent2); background:var(--bg3); }
        #searchWrap { position:relative; }
        #search {
            background:var(--bg3);
            border:1px solid var(--border);
            color:var(--text);
            padding:7px 14px 7px 34px;
            border-radius:20px;
            font-size:0.8rem;
            width:180px;
            outline:none;
            transition:var(--trans);
        }
        #search:focus { border-color:var(--accent); width:240px; }
        .search-icn { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); }

        #content {
            flex:1;
            padding:28px 32px 50px;
            max-width:960px;
            width:100%;
            margin:0 auto;
            animation:fadeUp 0.35s ease;
        }
        @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
        .hero {
            text-align:center;
            padding:30px 20px 20px;
            background:linear-gradient(160deg, #1a0d35, #0b0714);
            border-radius:var(--radius2);
            margin-bottom:28px;
            border:1px solid var(--border);
        }
        .hero h1 {
            font-size:2rem;
            font-weight:800;
            background:linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }
        .topic-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
            gap:14px;
        }
        .topic-card {
            background:linear-gradient(145deg, #1c1238, #231840);
            border:1px solid var(--border);
            border-radius:var(--radius2);
            padding:20px;
            cursor:pointer;
            transition:var(--trans);
            text-decoration:none;
            color:inherit;
        }
        .topic-card:hover {
            border-color:var(--accent);
            box-shadow:0 0 30px rgba(139,92,246,0.3);
            transform:translateY(-3px);
        }
        .topic-card .t-icon { font-size:2rem; }
        .topic-card .t-name { font-weight:700; }
        .topic-card .t-desc { font-size:0.75rem; color:var(--muted); margin-top:4px; }

        .art-body {
            background:var(--bg2);
            border:1px solid var(--border);
            border-radius:var(--radius2);
            padding:24px 28px;
            margin-top:16px;
            line-height:1.8;
        }
        .art-body h1,.art-body h2,.art-body h3 { color:var(--accent2); margin:1.4em 0 0.5em; }
        .art-body p { margin-bottom:0.8em; color:var(--text2); }
        .art-body a { color:var(--accent2); }
        .art-body img, .art-body video { max-width:100%; border-radius:var(--radius); margin:0.8em 0; }
        .dl-btn {
            display:inline-block;
            padding:8px 16px;
            background:var(--accent);
            color:#fff;
            border-radius:6px;
            text-decoration:none;
            margin-top:10px;
        }

        /* Shader-Klassen (Auswahl) */
        .sh-rainbow { background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); background-size:200% 100%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:sh-rainbow-anim 3s linear infinite; }
        @keyframes sh-rainbow-anim { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
        .sh-glow { text-shadow:0 0 10px var(--accent2),0 0 30px var(--accent); animation:sh-glow-pulse 2s infinite; }
        @keyframes sh-glow-pulse { 0%,100%{text-shadow:0 0 10px var(--accent2)} 50%{text-shadow:0 0 25px #fff,0 0 60px var(--accent2)} }
        .sh-warn { background:rgba(239,68,68,0.2); border:2px solid #ef4444; border-radius:8px; padding:12px 16px; color:#fca5a5; font-weight:600; box-shadow:0 0 25px rgba(239,68,68,0.35); animation:sh-warn-pulse 1.5s infinite; outline:3px solid rgba(239,68,68,0.5); outline-offset:2px; }
        @keyframes sh-warn-pulse { 0%,100%{box-shadow:0 0 25px rgba(239,68,68,0.35)} 50%{box-shadow:0 0 50px rgba(239,68,68,0.6)} }

        @media (max-width:860px) {
            #sidebar { position:fixed; left:-100%; top:0; z-index:200; transition:left 0.3s; }
            #sidebar.open { left:0; }
            #burger { display:block; }
            #content { padding:16px 12px; }
            .topic-grid { grid-template-columns:1fr; }
            #search { width:120px; }
            #search:focus { width:160px; }
        }
    </style>
</head>
<body>
<div id="sidebar">
    <div class="side-top"><span style="font-size:1.4rem;">📚</span><span class="logo" onclick="navHome()">WikiDash</span></div>
    <nav class="side-tree" id="treeNav"></nav>
    <div class="side-bottom"><span id="statFiles">0 Dateien</span><span id="statFolders">0 Ordner</span></div>
</div>
<div id="overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:150;cursor:pointer;" onclick="closeSidebar()"></div>
<div id="main">
    <header id="topbar">
        <button id="burger" onclick="toggleSidebar()">☰</button>
        <nav id="breadcrumb"><span onclick="navHome()">🏠 Home</span></nav>
        <div id="searchWrap"><input type="text" id="search" placeholder="Suchen..." oninput="doSearch(this.value)"><span class="search-icn">🔍</span></div>
    </header>
    <main id="content"></main>
</div>

<script>
    // ═══════ KONFIGURATION ═══════
    const GITHUB_USER = 'DEIN_GITHUB_USERNAME';   // <-- HIER EINTRAGEN
    const GITHUB_REPO = 'DEIN_REPO_NAME';         // <-- HIER EINTRAGEN
    const API_BASE = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`;

    let structure = { folders: [] };
    let currentPath = null;       // Aktueller Ordner-Pfad (null = Home)
    let currentFile = null;       // Aktuelle Datei
    let treeExpanded = {};
    let mdCache = {};

    // ═══ STRUKTUR LADEN ═══
    async function fetchStructure(path = '') {
        const url = `${API_BASE}/${path}`;
        const resp = await fetch(url);
        if (!resp.ok) return [];
        const items = await resp.json();
        const result = [];
        for (const item of items) {
            if (item.type === 'dir') {
                const children = await fetchStructure(item.path);
                result.push({ type: 'folder', name: item.name, path: item.path, children });
            } else if (item.type === 'file') {
                result.push({ type: 'file', name: item.name, path: item.path, download_url: item.download_url });
            }
        }
        return result;
    }

    async function initStructure() {
        try {
            structure.folders = await fetchStructure();
            renderAll();
        } catch (e) {
            document.getElementById('content').innerHTML = '<p>⚠️ Fehler beim Laden der Repository-Struktur. Bitte überprüfe deine GitHub-Konfiguration.</p>';
        }
    }

    // ═══ NAVIGATION ═══
    function navHome() { currentPath = null; currentFile = null; renderAll(); }
    function navFolder(path) { currentPath = path; currentFile = null; renderAll(); }
    async function navFile(file) { currentFile = file; renderAll(); }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('open') ? 'block' : 'none';
    }
    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').style.display = 'none';
    }

    // ═══ RENDERING ═══
    function renderAll() {
        renderSidebar();
        renderContent();
    }

    function renderSidebar() {
        const nav = document.getElementById('treeNav');
        let html = '';
        const renderTree = (items, depth = 0) => {
            for (const item of items) {
                if (item.type === 'folder') {
                    const isExpanded = treeExpanded[item.path] !== false;
                    html += `<div class="tree-item" style="padding-left:${10+depth*16}px" onclick="toggleFolder('${item.path}')">
                        <span class="icon">${isExpanded ? '📂' : '📁'}</span>${item.name}
                    </div>`;
                    html += `<div class="tree-children${isExpanded ? '' : ' collapsed'}" data-folder="${item.path}">`;
                    if (item.children) renderTree(item.children, depth + 1);
                    html += `</div>`;
                } else {
                    const isMd = item.name.endsWith('.md');
                    const icon = isMd ? '📄' : (item.name.match(/\.(png|jpg|jpeg|gif|svg)$/i) ? '🖼️' : (item.name.match(/\.(mp4|webm|mov)$/i) ? '🎬' : '📥'));
                    html += `<div class="tree-item${currentFile?.path === item.path ? ' active' : ''}" style="padding-left:${10+depth*16}px" onclick="navFile(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                        <span class="icon">${icon}</span>${item.name.replace(/\.md$/, '')}
                    </div>`;
                }
            }
        };
        renderTree(structure.folders);
        nav.innerHTML = html;
        document.getElementById('statFolders').textContent = countFolders(structure.folders) + ' Ordner';
        document.getElementById('statFiles').textContent = countFiles(structure.folders) + ' Dateien';
    }

    function toggleFolder(path) {
        treeExpanded[path] = !treeExpanded[path];
        renderSidebar();
    }

    function countFolders(items) {
        let c = 0;
        for (const i of items) {
            if (i.type === 'folder') { c++; if (i.children) c += countFolders(i.children); }
        }
        return c;
    }
    function countFiles(items) {
        let c = 0;
        for (const i of items) {
            if (i.type === 'file') c++;
            else if (i.children) c += countFiles(i.children);
        }
        return c;
    }

    // ═══ CONTENT RENDERING ═══
    async function renderContent() {
        const area = document.getElementById('content');
        if (!currentPath && !currentFile) {
            // Home: Zeige Top-Level-Ordner
            const folders = structure.folders.filter(f => f.type === 'folder');
            area.innerHTML = `
                <div class="hero"><h1>📚 WikiDash</h1><p>Dokumentation, Notizen & Wissen</p></div>
                <div class="topic-grid">
                    ${folders.map(f => `
                        <div class="topic-card" onclick="navFolder('${f.path}')">
                            <div class="t-icon">📁</div>
                            <div class="t-name">${f.name}</div>
                            <div class="t-desc">${f.children?.length || 0} Einträge</div>
                        </div>
                    `).join('')}
                </div>
            `;
        } else if (currentPath && !currentFile) {
            // Ordneransicht
            const folder = findFolderByPath(currentPath);
            if (!folder) { area.innerHTML = '<p>Ordner nicht gefunden.</p>'; return; }
            area.innerHTML = `<h2>📁 ${folder.name}</h2><div class="topic-grid">
                ${folder.children?.map(c => {
                    if (c.type === 'folder') return `<div class="topic-card" onclick="navFolder('${c.path}')"><div class="t-icon">📁</div><div class="t-name">${c.name}</div></div>`;
                    const isMd = c.name.endsWith('.md');
                    return `<div class="topic-card" onclick='navFile(${JSON.stringify(c)})'><div class="t-icon">${isMd ? '📄' : '📥'}</div><div class="t-name">${c.name.replace(/\.md$/,'')}</div></div>`;
                }).join('')}
            </div>`;
        } else if (currentFile) {
            // Dateiansicht
            const file = currentFile;
            if (file.name.endsWith('.md')) {
                let md = mdCache[file.path];
                if (!md) {
                    try {
                        const resp = await fetch(file.download_url);
                        md = await resp.text();
                        mdCache[file.path] = md;
                    } catch { md = '# Fehler beim Laden'; }
                }
                area.innerHTML = `<h2>📄 ${file.name.replace(/\.md$/, '')}</h2><div class="art-body">${marked.parse(md)}</div>`;
            } else if (file.name.match(/\.(png|jpg|jpeg|gif|svg)$/i)) {
                area.innerHTML = `<h2>🖼️ ${file.name}</h2><img src="${file.download_url}" alt="${file.name}" style="max-width:100%;border-radius:var(--radius);">`;
            } else if (file.name.match(/\.(mp4|webm|mov)$/i)) {
                area.innerHTML = `<h2>🎬 ${file.name}</h2><video controls src="${file.download_url}" style="max-width:100%;border-radius:var(--radius);"></video>`;
            } else {
                area.innerHTML = `<h2>📥 ${file.name}</h2><a class="dl-btn" href="${file.download_url}" download>⬇️ Download</a>`;
            }
        }
    }

    function findFolderByPath(path) {
        const search = (items) => {
            for (const i of items) {
                if (i.type === 'folder' && i.path === path) return i;
                if (i.children) { const f = search(i.children); if (f) return f; }
            }
            return null;
        };
        return search(structure.folders);
    }

    function doSearch(q) {
        if (!q) { renderAll(); return; }
        const results = [];
        const searchItems = (items) => {
            for (const i of items) {
                if (i.type === 'file' && i.name.toLowerCase().includes(q.toLowerCase())) results.push(i);
                if (i.children) searchItems(i.children);
            }
        };
        searchItems(structure.folders);
        const area = document.getElementById('content');
        area.innerHTML = `<h2>🔍 Suchergebnisse für "${q}"</h2>` + results.map(r => `<div class="tree-item" onclick='navFile(${JSON.stringify(r)})'>📄 ${r.path}</div>`).join('');
    }

    // ═══ INIT ═══
    marked.setOptions({ breaks:true, gfm:true, sanitize:false });
    initStructure();
</script>
</body>
</html>
