<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Muirio Link Button</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        .btn-modern {
            padding: 15px 30px;
            font-family: 'Arial', sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #6a0dad; /* Purple */
            border: 2px solid #ffffff;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.3s;
            box-shadow: 0 4px 15px rgba(106, 13, 173, 0.4);
        }

        .btn-modern:hover {
            background-color: #8a2be2;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <a href="https://muirio.netlify.app" target="_blank" class="btn-modern">Besuche Muirio.de</a>

</body>
</html>
