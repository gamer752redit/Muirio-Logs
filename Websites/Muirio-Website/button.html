<!DOCTYPE html>
<html>
<body>

<!-- 
    Abgerundete Ecken sind in 'reinem HTML' (ohne CSS) nicht möglich, 
    da HTML nur für die Struktur zuständig ist. 
    Hier ist die Lösung mit dem notwendigen Inline-CSS für den 'border-radius'.
-->

<a href="https://muirio.netlify.app" target="_blank" 
   style="display: inline-block; 
          padding: 20px 40px; 
          background-color: #6a0dad; 
          color: #ffffff; 
          text-decoration: none; 
          font-family: sans-serif; 
          font-size: 20px; 
          font-weight: bold; 
          border: 3px solid #ffffff; 
          border-radius: 25px; 
          text-align: center;">
    Besuche Muirio.de
</a>

</body>
</html>
